# Documentation gaps and architecture violations a pull request introduces, as one PR comment (see docwizz.yaml).
name: docwizz
on: pull_request
permissions:
  contents: read
  pull-requests: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }   # check --since needs the base commit
      - uses: mycaravam-crypto/docwizz@main
        with: { path: . }
